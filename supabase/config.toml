# Supabase CLI configuration. Generated for SYSTEMACT.
# Reference: https://supabase.com/docs/guides/cli/config

# Identificador del proyecto local. Debe coincidir con el nombre de la carpeta
# que contiene este archivo.
project_id = "systemact"

# ─── API ─────────────────────────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ─── Base de datos ───────────────────────────────────────────────────────
[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.migrations]
enabled = true

# ─── Studio (panel local) ────────────────────────────────────────────────
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ─── Inbucket (servidor SMTP local para correos de auth) ─────────────────
[inbucket]
enabled = true
port = 54324

# ─── Storage ─────────────────────────────────────────────────────────────
[storage]
enabled = true
file_size_limit = "50MiB"

# ─── Auth ────────────────────────────────────────────────────────────────
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# ─── Realtime ────────────────────────────────────────────────────────────
[realtime]
enabled = true

# ─── Edge Functions ──────────────────────────────────────────────────────
[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# ─── Análisis ────────────────────────────────────────────────────────────
[analytics]
enabled = false
